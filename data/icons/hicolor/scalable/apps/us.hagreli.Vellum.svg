<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- A page set in two faces: a serif display line over body copy, with the
       measure narrower than the sheet. What survives at 16px is the contrast
       between the heading and the lines under it, which is what the app is
       about — so that is the only thing the icon says. -->
  <defs>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2efe6"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9d3c4"/>
      <stop offset="1" stop-color="#c3bcaa"/>
    </linearGradient>
  </defs>

  <!-- The sheet behind, so the front one has something to sit on. -->
  <g transform="rotate(-5 64 64)">
    <rect x="26" y="16" width="72" height="94" rx="7" fill="url(#edge)"/>
  </g>

  <g transform="rotate(2 64 64)">
    <rect x="22" y="14" width="80" height="102" rx="7" fill="url(#sheet)"/>
    <rect x="22" y="14" width="80" height="102" rx="7" fill="none"
          stroke="#c9c2b1" stroke-width="1.5"/>

    <!-- The display line, and the rule a sectioned style puts under it. -->
    <rect x="35" y="30" width="42" height="13" rx="2" fill="#1f1c17"/>
    <rect x="35" y="52" width="54" height="2.5" fill="#8b2f2f"/>

    <g fill="#6f6a5f">
      <rect x="35" y="64" width="54" height="5" rx="2.5"/>
      <rect x="35" y="76" width="54" height="5" rx="2.5"/>
      <rect x="35" y="88" width="54" height="5" rx="2.5"/>
      <rect x="35" y="100" width="30" height="5" rx="2.5"/>
    </g>
  </g>
</svg>
